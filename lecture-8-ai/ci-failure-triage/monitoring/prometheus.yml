global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["ci-triage-n8n:5678"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
