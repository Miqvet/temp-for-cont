kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shop5
networking:
  # kindnet (the default CNI) accepts NetworkPolicy objects but never enforces
  # them — disable it so Cilium is the only CNI on the cluster.
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
  - role: worker
    image: kindest/node:v1.33.1
  - role: worker
    image: kindest/node:v1.33.1
