nameOverride: ""
fullnameOverride: ""

databaseURL: postgres://shop:shop@shop-postgres-rw:5432/shop?sslmode=disable

api:
  replicaCount: 4

  image:
    repository: lab5/api
    tag: 0.1.0
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 8080
    nodePort: 30080

  healthFail: false

  probes:
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 5

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

worker:
  replicaCount: 2

  image:
    repository: lab5/worker
    tag: 0.1.0
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  pollInterval: 1s

  probes:
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 5

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

containerSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false

monitoring:
  enabled: true
  interval: 15s
  scrapeTimeout: 5s
  dashboard:
    enabled: true
  alerts:
    apiUnavailableFor: 1m
    errorRateThreshold: 0.05
    errorRateFor: 2m
    latencyP95Seconds: 1
    latencyFor: 5m

# Zero-trust access matrix, off by default so Part 1/2 (pod chaos under a flat
# network) can be demonstrated first. Flip `enabled: true` for Part 4.
networkPolicy:
  enabled: true

  dns:
    namespace: kube-system
    podLabelKey: k8s-app
    podLabelValue: kube-dns
    port: 53

  api:
    labelKey: app.kubernetes.io/name
    labelValue: api
    port: 8080

  worker:
    labelKey: app.kubernetes.io/name
    labelValue: worker

  postgres:
    labelKey: app.kubernetes.io/name
    labelValue: postgres
    port: 5432

  # Part 6 fault injection: one candidate fault, applied by scripts/inject-fault.sh
  # via `helm upgrade --set networkPolicy.fault.inject=...`. "none" renders the
  # clean matrix above untouched.
  fault:
    inject: none   # none | wrong-worker-label | wrong-postgres-port | disable-dns | wrong-api-port

postgres:
  instances: 1

  storage:
    size: 1Gi
    storageClass: standard

  database: shop
  owner: shop

  credentials:
    username: shop
    password: shop

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
